# Project-level Codex defaults.
# Codex loads this file only after the repository is trusted.
# Shared hooks live in .agents/hooks and are also registered in .claude/settings.json.

model = "gpt-5.6-sol"
model_reasoning_effort = "low"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
personality = "pragmatic"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "branch-changes", "context-remaining", "thread-title", "task-progress"]
status_line_use_colors = true

[features]
# Built-in memory is off; project memory lives in .agents/memories (see AGENTS.md).
memories = false

[desktop]
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = true
followUpQueueMode = "queue"

# Hook commands resolve from the git root because Codex runs them in the session cwd.

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.agents/hooks/memory-index.py"'
timeout = 10
additionalContextLimit = 8000
statusMessage = "Loading project memory index"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.agents/hooks/redact-secrets.py"'
timeout = 10

# Codex matches shell commands as Bash; file edits (apply_patch) as Edit or Write.
[[hooks.PostToolUse]]
matcher = "Bash|mcp__.*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.agents/hooks/redact-secrets.py"'
timeout = 15

[[hooks.PostToolUse]]
matcher = "Edit|Write"
[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.agents/hooks/memory-guard.py"'
timeout = 15
statusMessage = "Linting memory files"
