name: agents-lint

# Off by default: runs only when started by hand from the Actions tab.
# To lint on every push and PR, uncomment push and pull_request.
on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  memory-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint memories and reports
        run: python3 .agents/tools/memory-lint.py
